<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Traffic Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #2d2d2d; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #3b3b3b; font-weight: 600; text-transform: uppercase; font-size: 0.85em; color: #aaa; }
        tr:hover { background-color: #353535; }
        .status-200 { color: #4ade80; font-weight: bold; }
        .status-400 { color: #fbbf24; font-weight: bold; }
        .status-500 { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Traffic Dashboard</h1>
        <div id="connection-status" style="color: #4ade80;">● Live Polling</div>
    </div>
    <table id="log-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Method</th>
                <th>Endpoint</th>
                <th>Status</th>
                <th>Response Time (ms)</th>
            </tr>
        </thead>
        <tbody id="log-body">
            <!-- Logs will appear here dynamically -->
        </tbody>
    </table>

    <script>
        const methods = ['GET', 'POST', 'PUT', 'DELETE'];
        const endpoints = ['/auth/login', '/users', '/messages', '/health', '/auth/register', '/users/1'];
        const statuses = [200, 201, 400, 401, 403, 404, 500, 502, 504];
        const statusWeights = [70, 10, 5, 2, 2, 4, 4, 1, 2];
        
        function getRandomStatus() {
            let rand = Math.random() * 100;
            for (let i = 0; i < statusWeights.length; i++) {
                if (rand < statusWeights[i]) return statuses[i];
                rand -= statusWeights[i];
            }
            return 200;
        }

        function addLog() {
            const tbody = document.getElementById('log-body');
            const row = document.createElement('tr');
            
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const method = methods[Math.floor(Math.random() * methods.length)];
            const endpoint = endpoints[Math.floor(Math.random() * endpoints.length)];
            const status = getRandomStatus();
            const time = Math.floor(Math.random() * 300) + 10;
            
            let statusClass = 'status-200';
            if (status >= 400 && status < 500) statusClass = 'status-400';
            if (status >= 500) statusClass = 'status-500';

            row.innerHTML = `
                <td>${timestamp}</td>
                <td><strong>${method}</strong></td>
                <td>${endpoint}</td>
                <td class="${statusClass}">${status}</td>
                <td>${time}ms</td>
            `;
            
            tbody.insertBefore(row, tbody.firstChild);
            
            if (tbody.children.length > 25) {
                tbody.removeChild(tbody.lastChild);
            }
        }

        setInterval(addLog, 1200);
        for(let i=0; i<8; i++) setTimeout(addLog, i*150);
    </script>
</body>
</html>
